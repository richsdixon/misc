:root{color-scheme:light;--ink:#173b35;--muted:#52665d;--paper:#f6f5ed;--green:#dce9ce}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px Volte,Arial,sans-serif}
main{max-width:1600px;margin:auto;padding:32px}
h1{font-size:40px;font-weight:400;margin:0 0 24px}
button,input,select{font:inherit}
.controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:28px;align-items:center;padding:24px;background:var(--green);border-radius:12px}
.controls>*{min-width:0}
label{display:block;font-size:14px}
input[type=search]{width:100%;min-width:0;padding:12px;margin-top:8px;border:1px solid #a8b99d;border-radius:6px;background:#fffefa;color:var(--ink);font-size:16px}
.range-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
#range{font-variant-numeric:tabular-nums;white-space:nowrap}
.alcohol-slider{position:relative;height:44px;margin:4px 0}
.alcohol-track{position:absolute;left:14px;right:14px;top:19px;height:6px;background:#b9c7ad;border-radius:9px}
.alcohol-selection{position:absolute;height:100%;left:var(--start,0%);right:calc(100% - var(--end,100%));background:var(--ink);border-radius:9px}
.alcohol-slider input[type=range]{position:absolute;inset:0;width:100%;height:44px;margin:0;padding:0;appearance:none;-webkit-appearance:none;background:transparent;pointer-events:none;border:0}
.alcohol-slider input[type=range]::-webkit-slider-runnable-track{height:6px;background:transparent}
.alcohol-slider input[type=range]::-moz-range-track{height:6px;background:transparent}
.alcohol-slider input[type=range]::-moz-range-progress{background:transparent}
.alcohol-slider input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border:3px solid #fffefa;border-radius:50%;background:var(--ink);box-shadow:0 0 0 1px var(--ink);pointer-events:auto;cursor:grab}
.alcohol-slider input[type=range]::-moz-range-thumb{width:22px;height:22px;border:3px solid #fffefa;border-radius:50%;background:var(--ink);box-shadow:0 0 0 1px var(--ink);pointer-events:auto;cursor:grab}
.alcohol-slider input[type=range]:focus-visible{outline:none}
.alcohol-slider input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid #c56a26;outline-offset:3px}
.alcohol-slider input[type=range]:focus-visible::-moz-range-thumb{outline:3px solid #c56a26;outline-offset:3px}
.range-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
#reset{min-height:44px;padding:12px 16px;border:1px solid #a8b99d;border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
#reset:hover{background:#edf4e5}
.meta{display:flex;justify-content:space-between;gap:16px;margin:22px 0 12px;color:var(--muted)}
.mobile-sort{display:none}
.table-wrap{overflow:auto;max-height:72vh;border:1px solid #d9dfd2;border-radius:8px;background:#fffefa}
table{width:100%;min-width:1050px;border-collapse:separate;border-spacing:0;table-layout:fixed}
col:nth-child(1){width:15%}
col:nth-child(2){width:14%}
col:nth-child(3){width:14%}
col:nth-child(4){width:22%}
col:nth-child(5){width:8%}
col:nth-child(6){width:27%}
th{position:sticky;top:0;background:#e8eddf;text-align:left;z-index:1}
th button{display:flex;justify-content:space-between;gap:8px;width:100%;padding:15px 12px;border:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer}
th button:hover{background:var(--green)}
th[aria-sort=ascending] .arrow,th[aria-sort=descending] .arrow{color:#b96a28}
td{padding:15px 12px;border-top:1px solid #e1e6da;vertical-align:top;line-height:1.45;overflow-wrap:anywhere}
td:first-child{font-size:17px}
td:nth-child(5){white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr:hover{background:#f0f5e8}
#empty{text-align:center;padding:35px;color:var(--muted)}
footer{font-size:12px;color:var(--muted);margin-top:15px;line-height:1.5}
button:focus-visible,input[type=search]:focus-visible,select:focus-visible,.table-wrap:focus-visible{outline:3px solid #b96a28;outline-offset:3px}
@media(max-width:1000px){
  .controls{grid-template-columns:1fr 1fr;gap:20px}
  #reset{justify-self:start}
}
@media(max-width:700px){
  main{padding:22px 14px}
  h1{font-size:32px;margin-bottom:20px}
  .controls{grid-template-columns:1fr;padding:18px;gap:20px}
  #reset{width:100%}
  .meta{font-size:14px;margin-top:20px}
  .desktop-hint{display:none}
  .mobile-sort{display:block;margin-bottom:16px}
  .mobile-sort select{display:block;width:100%;min-width:0;min-height:44px;margin-top:7px;padding:10px;border:1px solid #a8b99d;border-radius:6px;background:#fffefa;color:var(--ink);font-size:16px}
  .table-wrap{overflow:visible;max-height:none;border:0;border-radius:0;background:transparent}
  table{display:block;width:100%;min-width:0;table-layout:auto}
  colgroup{display:none}
  thead{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  tbody{display:grid;gap:14px}
  tbody tr{display:block;min-width:0;padding:16px;background:#fffefa;border:1px solid #d9dfd2;border-radius:10px}
  tbody tr:hover{background:#fffefa}
  td{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;min-width:0;padding:9px 0;border:0;font-size:14px}
  td+td{border-top:1px solid #edf0e8}
  td::before{content:attr(data-label);font-size:12px;color:var(--muted)}
  td:first-child{display:block;font-size:21px;line-height:1.25;padding:0 0 12px}
  td:first-child::before{display:none}
  td:nth-child(5){white-space:normal}
  td:last-child{padding-bottom:0}
  td .value{min-width:0;overflow-wrap:anywhere}
  #empty{padding:25px 12px}
}
</style>
</head>

rn x Puhaste", "Impy Pastry Stout", "Imperial Pastry Stout", "10.8%", "An imperial pastry stout inspired by dunking a sugary cinnamon bun into coffee! Fika forever!"]]}</script>
<script>
"use strict";
const {headers, rows} = JSON.parse(document.getElementById("data").textContent);
const get = id => document.getElementById(id);
const search = get("search"), minimum = get("minimum"), maximum = get("maximum");
const slider = document.querySelector(".alcohol-slider");
const normalize = text => text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const entries = rows.map((cells, index) => ({
  cells, index,
  abv: parseFloat(cells[4]),
  text: normalize(cells.join(" "))
}));
const lower = Math.min(...entries.map(row => row.abv));
const upper = Math.max(...entries.map(row => row.abv));
let sortColumn = 4, sortDirection = 1;
for (const input of [minimum, maximum]) {
  input.min = lower;
  input.max = upper;
}
minimum.value = lower;
maximum.value = upper;
headers.forEach((name, column) => {
  const th = document.createElement("th");
  th.scope = "col";
  th.id = `column-${column}`;
  th.setAttribute("role", "columnheader");
  const button = document.createElement("button");
  button.type = "button";
  const label = document.createElement("span");
  label.textContent = name;
  const arrow = document.createElement("span");
  arrow.className = "arrow";
  arrow.setAttribute("aria-hidden", "true");
  button.append(label, arrow);
  button.addEventListener("click", () => {
    sortDirection = sortColumn === column ? -sortDirection : 1;
    sortColumn = column;
    render();
  });
  th.append(button);
  get("headings").append(th);
  for (const direction of [1, -1]) {
    const option = document.createElement("option");
    option.value = `${column}:${direction}`;
    const order = column === 4
      ? (direction === 1 ? "Low to high" : "High to low")
      : (direction === 1 ? "A–Z" : "Z–A");
    option.textContent = `${name}: ${order}`;
    get("sort").append(option);
  }
});
get("sort").addEventListener("change", () => {
  [sortColumn, sortDirection] = get("sort").value.split(":").map(Number);
  render();
});
function render() {
  const low = Number(minimum.value), high = Number(maximum.value);
  const keyword = normalize(search.value.trim());
  const percent = value => upper === lower ? 0 : 100 * (value - lower) / (upper - lower);
  slider.style.setProperty("--start", percent(low) + "%");
  slider.style.setProperty("--end", percent(high) + "%");
  minimum.style.zIndex = low === upper ? "3" : "1";
  maximum.style.zIndex = "2";
  get("range").textContent = `${low.toFixed(1)}% – ${high.toFixed(1)}%`;
  minimum.title = `Minimum: ${low.toFixed(1)}%`;
  maximum.title = `Maximum: ${high.toFixed(1)}%`;
  minimum.setAttribute("aria-valuetext", `${low.toFixed(1)} percent`);
  maximum.setAttribute("aria-valuetext", `${high.toFixed(1)} percent`);
  get("sort").value = `${sortColumn}:${sortDirection}`;
  const filtered = entries.filter(row =>
    row.abv >= low && row.abv <= high && row.text.includes(keyword)
  );
  filtered.sort((a, b) => {
    const comparison = sortColumn === 4
      ? a.abv - b.abv
      : a.cells[sortColumn].localeCompare(b.cells[sortColumn], "en", {
          sensitivity: "base", numeric: true
        });
    return comparison * sortDirection || a.index - b.index;
  });
  const fragment = document.createDocumentFragment();
  filtered.forEach(row => {
    const tr = document.createElement("tr");
    tr.setAttribute("role", "row");
    row.cells.forEach((value, column) => {
      const td = document.createElement("td");
      td.setAttribute("role", "cell");
      td.setAttribute("headers", `column-${column}`);
      td.dataset.label = headers[column];
      const text = document.createElement("span");
      text.className = "value";
      text.textContent = value;
      td.append(text);
      tr.append(td);
    });
    fragment.append(tr);
  });
  get("results").replaceChildren(fragment);
  get("count").textContent = `${filtered.length} of ${rows.length} entries`;
  get("empty").hidden = filtered.length > 0;
  Array.from(get("headings").children).forEach((th, column) => {
    const active = column === sortColumn;
    th.setAttribute("aria-sort", active ? (sortDirection === 1 ? "ascending" : "descending") : "none");
    th.querySelector(".arrow").textContent = active ? (sortDirection === 1 ? "↑" : "↓") : "↕";
    th.querySelector("button").setAttribute(
      "aria-label",
      `Sort by ${headers[column]}, ${active && sortDirection === 1 ? "descending" : "ascending"}`
    );
  });
}
search.addEventListener("input", render);
minimum.addEventListener("input", () => {
  if (+minimum.value > +maximum.value) minimum.value = maximum.value;
  render();
});
maximum.addEventListener("input", () => {
  if (+maximum.value < +minimum.value) maximum.value = minimum.value;
  render();
});
get("reset").addEventListener("click", () => {
  search.value = "";
  minimum.value = lower;
  maximum.value = upper;
  render();
});
render();
</script>
</body>
</html>
